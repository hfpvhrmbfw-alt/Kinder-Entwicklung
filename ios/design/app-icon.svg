<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App-Icon „Kleine Schritte“: Keimling und Trittsteine, nachgezeichnet nach public/icons/icon-512.png.
       Vollflächig ohne Transparenz und ohne eigene Rundung (iOS rundet selbst). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F5EDDD"/>
    </linearGradient>
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DAA78"/>
      <stop offset="1" stop-color="#7E8E5E"/>
    </linearGradient>
    <linearGradient id="leafR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F744A"/>
      <stop offset="1" stop-color="#76895A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-10 -10)">
    <!-- Stiel -->
    <path d="M540 560 C 538 500, 526 452, 510 410" fill="none" stroke="#6F8452" stroke-width="16" stroke-linecap="round"/>
    <!-- linkes Blatt -->
    <path d="M512 420 C 470 330, 380 268, 262 262 C 290 360, 380 430, 512 420 Z" fill="url(#leafL)"/>
    <path d="M500 410 C 440 350, 380 318, 318 300" fill="none" stroke="#F5EFE1" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <!-- rechtes Blatt -->
    <path d="M526 450 C 500 330, 560 190, 790 118 C 800 280, 700 410, 526 450 Z" fill="url(#leafR)"/>
    <path d="M540 430 C 590 330, 650 250, 724 196" fill="none" stroke="#F5EFE1" stroke-width="8" stroke-linecap="round" opacity=".85"/>
    <!-- Trittsteine -->
    <ellipse cx="630" cy="566" rx="56" ry="22" fill="#F4CC86"/>
    <ellipse cx="582" cy="640" rx="104" ry="36" fill="#D3B07E"/>
    <ellipse cx="496" cy="740" rx="146" ry="48" fill="#97A06E" transform="rotate(4 496 740)"/>
    <ellipse cx="410" cy="866" rx="196" ry="62" fill="#8C966E" transform="rotate(5 410 866)"/>
  </g>
</svg>
