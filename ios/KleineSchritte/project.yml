# Xcode-Projekt für die iPhone-App. Erzeugen auf dem Mac mit:
#   brew install xcodegen && cd ios/KleineSchritte && xcodegen
# Danach KleineSchritte.xcodeproj öffnen. Siehe ios/README.md.
name: KleineSchritte
options:
  bundleIdPrefix: de.kleineschritte
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  KleineSchritteCore:
    path: ../KleineSchritteCore
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  KleineSchritte:
    type: application
    platform: iOS
    sources:
      - path: KleineSchritte
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      # Gleicher Content und gleiche Texte wie die Web-App (als Ordner ins App-Bundle)
      - path: ../../content
        type: folder
        buildPhase: resources
      - path: ../../src/i18n/locales/de.json
        buildPhase: resources
      - path: KleineSchritte/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KleineSchritteCore
    scheme:
      testTargets: [KleineSchritteTests]
    info:
      path: KleineSchritte/Info.plist
      properties:
        CFBundleDisplayName: Kleine Schritte
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Schriften wie in der Web-App (SIL Open Font License, siehe Resources/Fonts)
        UIAppFonts:
          - Lora-SemiBold.ttf
          - Lora-Bold.ttf
          - SourceSans3-Regular.ttf
          - SourceSans3-Medium.ttf
          - SourceSans3-SemiBold.ttf
          - SourceSans3-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kleineschritte.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
  KleineSchritteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KleineSchritteTests]
    dependencies:
      - target: KleineSchritte
