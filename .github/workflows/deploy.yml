# Bei jedem Push auf main: Tests + Content-Validierung, Build, Deployment auf GitHub Pages.
# Neueste Version unter /<repo>/, jede Version aus versions.json zusätzlich unter /<repo>/v/<version>/.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Test und Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ältere Versionen werden aus ihren Commits gebaut
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests und Content-Validierung
        run: npm test
      - name: Build
        run: npm run build
        env:
          # GitHub Pages liefert unter https://<nutzer>.github.io/<repo>/ aus
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Alle Versionen unter /v/<version>/ (versions.json)
        if: github.ref == 'refs/heads/main'
        run: node scripts/build-versions.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
